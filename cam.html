<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title></title>
<style>*{margin:0;padding:0}body{background:#000}video{width:100vw;height:100vh;display:block}</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<script>
navigator.mediaDevices.getUserMedia({video:true,audio:false})
  .then(s => document.getElementById('v').srcObject = s)
  .catch(e => document.body.innerHTML = `<p style="color:red;padding:2em;font:1rem sans-serif">${e.message}</p>`);
</script>
</body>
</html>
